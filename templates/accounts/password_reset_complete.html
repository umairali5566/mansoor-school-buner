{% extends 'base.html' %}
{% block title %}Password Reset Complete | School Management System{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="card shadow-sm border-0 auth-card">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="success-orb mx-auto">
                <i class="bi bi-check2"></i>
            </div>
            <h2 class="h3 mb-2">Password Reset Complete</h2>
            <p class="text-muted mb-4">Your password has been updated successfully. You can sign in with the new password now.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Go to Login</a>
        </div>
    </div>
</div>
{% endblock %}
