{% extends 'base.html' %}

{% block content %}
<h1>View Students</h1>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Class</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.classroom.name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
