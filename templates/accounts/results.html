{% extends "base.html" %}

{% block title %}Results | Mansoor School Buner{% endblock %}

{% block content %}
<div class="dashboard-page animate-fade-in">
    <div class="saas-panel">
        <div class="saas-panel-body">
            <div class="text-center">
                <h2>Results Management</h2>
                <p>Manage student exam results and grades.</p>
                <div class="row g-3 mt-4">
                    <div class="col-md-4">
                        <a href="{% url 'result_list' %}" class="btn btn-primary btn-lg w-100">View Results</a>
                    </div>
                    <div class="col-md-4">
                        <a href="{% url 'add_result' %}" class="btn btn-success btn-lg w-100">Add Result</a>
                    </div>
                    <div class="col-md-4">
                        <a href="{% url 'admin_dashboard' %}" class="btn btn-info btn-lg w-100">Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
