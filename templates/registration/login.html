{% extends 'base.html' %}
{% block title %}Login | School Management System{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="card shadow-sm border-0 auth-card">
        <div class="card-body p-4 p-md-5">
            <span class="section-badge">Portal Access</span>
            <h2 class="h3 mt-3 mb-2">Login</h2>
            <p class="text-muted mb-4">Use your account credentials to access the school management portal.</p>

            <form method="post" class="d-flex flex-column gap-3">
                {% csrf_token %}
                <div>
                    <label>Username</label>
                    <input type="text" name="username" class="form-control">
                </div>

                <div>
                    <label>Password</label>
                    <input type="password" name="password" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
